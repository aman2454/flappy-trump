<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arcade Gallery</title>
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <header class="gallery-header">
    <h1>Arcade Gallery</h1>
    <p>Classic touch arcade — pick a game</p>
  </header>

  <main class="game-grid">
    <a class="game-card" href="games/flappy-trump/">
      <div class="game-thumb flappy">🟠</div>
      <div class="game-info">
        <h2>Flappy Trump</h2>
        <span>Tap to flap</span>
      </div>
    </a>

    <a class="game-card" href="games/snake/">
      <div class="game-thumb snake">🐍</div>
      <div class="game-info">
        <h2>Snake</h2>
        <span>Swipe to steer</span>
      </div>
    </a>

    <a class="game-card" href="games/pong/">
      <div class="game-thumb pong">🏓</div>
      <div class="game-info">
        <h2>Pong</h2>
        <span>Drag your paddle</span>
      </div>
    </a>

    <a class="game-card" href="games/breakout/">
      <div class="game-thumb breakout">🧱</div>
      <div class="game-info">
        <h2>Breakout</h2>
        <span>Break all bricks</span>
      </div>
    </a>

    <a class="game-card" href="games/space-invaders/">
      <div class="game-thumb invaders">👾</div>
      <div class="game-info">
        <h2>Space Invaders</h2>
        <span>Swipe to move · tap to shoot</span>
      </div>
    </a>

    <a class="game-card" href="games/asteroids/">
      <div class="game-thumb asteroids">☄️</div>
      <div class="game-info">
        <h2>Asteroids</h2>
        <span>Survive the rocks</span>
      </div>
    </a>
  </main>

  <footer class="gallery-footer">
    More games coming soon
  </footer>
</body>
</html>
