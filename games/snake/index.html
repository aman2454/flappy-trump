<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snake - Arcade Gallery</title>
  <link rel="stylesheet" href="../../css/game-common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../../" class="gallery-back">← Gallery</a>
  <div id="game-container">
    <canvas id="game-canvas" width="288" height="512"></canvas>
    <div id="overlay">
      <h1>Snake</h1>
      <p id="instructions">Swipe or use arrows</p>
      <p id="score-display"></p>
    </div>
  </div>
  <div class="touch-controls dpad" id="dpad">
    <span class="empty"></span><button class="touch-btn" data-dir="up">▲</button><span class="empty"></span>
    <button class="touch-btn" data-dir="left">◀</button><span class="empty"></span><button class="touch-btn" data-dir="right">▶</button>
    <span class="empty"></span><button class="touch-btn" data-dir="down">▼</button><span class="empty"></span>
  </div>
  <script src="game.js"></script>
</body>
</html>
